# Push to main -> build a signed release APK -> publish it as a GitHub Release.
# On the phone: open https://github.com/<owner>/<repo>/releases/latest/download/xhs-lite.apk
#
# Secrets (Settings -> Secrets and variables -> Actions), values in keystore/ on the PC:
#   XHS_KEYSTORE_BASE64    base64 of keystore/release.jks
#   XHS_KEYSTORE_PASSWORD  XHS_KEY_ALIAS  XHS_KEY_PASSWORD   from keystore/release.properties
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Restore release keystore
        env:
          KS: ${{ secrets.XHS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::secret XHS_KEYSTORE_BASE64 is missing"; exit 1; fi
          mkdir -p keystore
          echo "$KS" | base64 -d > keystore/release.jks

      - name: Build
        env:
          XHS_KEYSTORE: keystore/release.jks
          XHS_KEYSTORE_PASSWORD: ${{ secrets.XHS_KEYSTORE_PASSWORD }}
          XHS_KEY_ALIAS: ${{ secrets.XHS_KEY_ALIAS }}
          XHS_KEY_PASSWORD: ${{ secrets.XHS_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk xhs-lite.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          msg="$(git log -1 --pretty=%s)"
          gh release create "$tag" xhs-lite.apk --target "$GITHUB_SHA" --title "$tag · $msg" --notes "$msg" --latest
